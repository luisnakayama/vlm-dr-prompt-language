# Modelos avaliados. `local: true` = cabe e roda no Mac (MPS, 36 GB); os demais só na nuvem.
# revision = commit fixo no Hugging Face (o mesmo do piloto); use_fast = processador de imagem fixo
# (false = o processador com que o checkpoint foi salvo), para o transformers não trocar o pré-processamento.
# As predições gravam a revisão efetivamente usada.

medgemma_4b:
  hf_id: google/medgemma-4b-it        # exige aceitar a licença HAI-DEF no Hugging Face
  revision: 290cda5eeccbee130f987c4ad74a59ae6f196408
  use_fast: false
  papel: modelo médico (principal)
  dtype: bfloat16
  attn_implementation: eager          # recomendado para a família Gemma 3
  local: true

gemma3_4b:
  hf_id: google/gemma-3-4b-it         # mesma arquitetura, sem treino médico
  revision: 093f9f388b31de276ce2de164bdc2081324b9767
  use_fast: false
  papel: controle sem treino médico
  dtype: bfloat16
  attn_implementation: eager
  local: true

qwen25vl_7b:
  hf_id: Qwen/Qwen2.5-VL-7B-Instruct  # generalista de outra família
  revision: cc594898137f460bfe9f0759e9844b3ce807cfb5
  use_fast: false
  papel: generalista
  dtype: bfloat16
  # resolução fixa para a comparação ser justa (Qwen usa resolução dinâmica); relatar nos métodos
  min_pixels: 802816                   # 896 x 896
  max_pixels: 802816
  local: true

medgemma_27b:
  hf_id: google/medgemma-27b-it
  revision: 2d3e00ea38b50018bf5dd3aa1009457cd2d5a48f
  use_fast: false
  papel: modelo médico maior
  dtype: bfloat16                      # ~54 GB em bf16: só na GPU da nuvem
  attn_implementation: eager
  local: false
